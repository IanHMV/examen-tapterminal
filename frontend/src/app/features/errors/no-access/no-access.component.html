<section class="page-narrow">
  <h2 class="h4 mb-3">Sin acceso</h2>

  @if (allowedLinks().length > 0) {
    <div class="alert alert-warning">Tus perfiles no incluyen esa sección.</div>
    <p class="mb-2">Puedes ir a:</p>
    <div class="list-group">
      @for (link of allowedLinks(); track link.key) {
        <a class="list-group-item list-group-item-action" [routerLink]="link.path">{{ link.label }}</a>
      }
    </div>
  } @else {
    <div class="alert alert-warning">
      Tu usuario todavía no tiene secciones asignadas. Pide a un administrador que te asigne un perfil.
    </div>
  }
</section>
