<header class="navbar navbar-expand navbar-dark bg-dark shadow-sm">
  <div class="container flex-wrap gap-2">
    <h1 class="navbar-brand fs-5 mb-0">Examen TAP Terminal</h1>
    @if (auth.currentUser(); as user) {
      <nav aria-label="Principal">
        <ul class="navbar-nav app-nav">
          @for (link of menu(); track link.key) {
            <li class="nav-item">
              <a class="nav-link" [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
      <div class="app-session d-flex align-items-center gap-3 ms-auto">
        <span class="app-session__user navbar-text small">{{ user.name }} · {{ user.email }}</span>
        <button type="button" class="btn btn-outline-light btn-sm app-session__logout" (click)="logout()">
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>

<main class="container py-4">
  <router-outlet />
</main>
