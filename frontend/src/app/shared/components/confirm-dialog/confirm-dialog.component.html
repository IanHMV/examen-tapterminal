<dialog #dialog class="dialog" [attr.aria-labelledby]="titleId">
  <h2 [id]="titleId" class="dialog__title">{{ title() }}</h2>
  <ng-content />
  <div class="dialog__actions">
    <button type="button" class="button button--secondary" (click)="close()">Cancelar</button>
    <button type="button" class="button button--danger" (click)="confirm()">{{ confirmLabel() }}</button>
  </div>
</dialog>
