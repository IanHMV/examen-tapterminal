<div class="export-buttons" role="group" aria-label="Exportar el listado">
  <button type="button" class="button button--secondary" [disabled]="downloading() !== null" (click)="download('xlsx')">
    {{ downloading() === 'xlsx' ? 'Generando…' : 'Exportar a Excel' }}
  </button>
  <button type="button" class="button button--secondary" [disabled]="downloading() !== null" (click)="download('pdf')">
    {{ downloading() === 'pdf' ? 'Generando…' : 'Exportar a PDF' }}
  </button>
</div>

@if (errorMessage(); as message) {
  <p class="alert alert--error export-buttons__error" role="alert">{{ message }}</p>
}
