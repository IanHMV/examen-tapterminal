@let current = page();
<nav class="pagination" aria-label="Paginación">
  @if (current.links.prev) {
    <a routerLink="." [queryParams]="{ pagina: current.meta.current_page - 1 }">← Anterior</a>
  }
  <span>
    @if (current.meta.from) {
      {{ current.meta.from }}–{{ current.meta.to }} de {{ current.meta.total }} {{ itemsLabel() }} ·
    }
    Página {{ current.meta.current_page }} de {{ current.meta.last_page }}
  </span>
  @if (current.links.next) {
    <a routerLink="." [queryParams]="{ pagina: current.meta.current_page + 1 }">Siguiente →</a>
  }
</nav>
