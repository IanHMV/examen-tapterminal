# Entorno de Desarrollo local.
name: examen-tapterminal

services:
  # PHP-FPM 8.2: ejecuta Laravel.
  # No publica puertos: solo Nginx puede hablarle.
  api:
    build: ./docker/php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mongo

  # Nginx: http://localhost:8000
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "8000:80"   # "puerto_PC:puerto_del_contenedor"
    volumes:
      - ./backend:/var/www/html   # misma ruta que en "api"
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro   # ro = solo lectura
    depends_on:
      - api

  # MongoDB 8.0: base de datos NoSQL del sistema.
  # Las credenciales vienen del archivo .env de la RAÍZ (.env.example).
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Falta MONGO_ROOT_USERNAME en el .env de la raíz}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD en el .env de la raíz}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:?Falta MONGO_DATABASE en el .env de la raíz}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Falta MONGO_APP_USERNAME en el .env de la raíz}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Falta MONGO_APP_PASSWORD en el .env de la raíz}
    ports:
      # Solo accesible 127.0.0.1. Puerto 27018, el 27017 lo usa tu MongoDB de Windows.
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db                                   # los datos sobreviven a "docker compose down"
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro    # scripts que corren solo la 1.ª vez

  # Mailpit: atrapa los correos de desarrollo para verlos en http://localhost:8025.
  # Laravel le envía por SMTP a "mailpit:1025" dentro de la red de Docker; nada sale a internet.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"   # bandeja de entrada (solo desde tu PC)

volumes:
  mongo_data:
