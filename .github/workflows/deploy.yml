# Despliegue continuo: cuando el CI de main termina bien, actualiza el VPS por SSH.
# También se puede lanzar a mano desde la pestaña Actions ("Run workflow").
name: Despliegue

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos despliegues a la vez; si llega otro, espera a que termine el actual.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  deploy:
    name: VPS (ianmartinez.dev)
    # Solo después de un CI exitoso en main (no de un PR), o si alguien lo lanzó a mano.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://ianmartinez.dev/examen-tapterminal/

    steps:
      - name: Revisar los secretos
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::notice title=Despliegue omitido::Faltan los secretos VPS_* (ver README, sección CI/CD)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # La llave solo puede ejecutar scripts/deploy.sh en el VPS (comando forzado en
      # ~/.ssh/authorized_keys): aunque alguien la robara, no tendría una terminal.
      - name: Desplegar por SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Huella conocida del servidor: si alguien se hiciera pasar por el VPS, SSH se niega a conectar.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST"

      - name: Verificar la aplicación publicada
        if: steps.secrets.outputs.configured == 'true'
        run: |
          base=https://ianmartinez.dev/examen-tapterminal/api/v1
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$base/healthcheck"
          echo
          # Sin token, la API debe responder 401 (no 500).
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/products")" = 401
