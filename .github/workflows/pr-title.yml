# El título del PR se convierte en el mensaje del commit al fusionar con squash,
# así que debe seguir Conventional Commits: "feat: ...", "fix(api): ...".
name: Título del PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# No necesita ningún permiso: solo lee el título del evento.
permissions: {}

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04

    steps:
      - name: Validar el título
        # El título va en una variable de entorno y no dentro del script: así un título
        # con comillas o $(...) no puede ejecutar comandos (inyección en el workflow).
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'

          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Título válido: $TITLE"
          else
            echo "::error title=Título del PR::\"$TITLE\" no sigue Conventional Commits. Ejemplos: \"feat: add product export\", \"fix(api): handle duplicate keys\"."
            exit 1
          fi
