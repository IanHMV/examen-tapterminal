# Servidor de Desarrollo → http://localhost:8000
server {
    listen 80;
    server_name localhost;
    server_tokens off;              # no revelar la versión de Nginx

    # Solo public/ es accesible desde el navegador:
    # .env, vendor/, app/... quedan fuera de alcance.
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Fotos de perfil de hasta 2 MB (Laravel valida el límite exacto).
    client_max_body_size 3m;

    # 1) Si el archivo existe (css, js, imagen), se entrega directo.
    # 2) Si no, la petición va a index.php y el router de Laravel decide.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Solo index.php se ejecuta.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass api:9000;      # "api" = nombre del servicio en docker-compose
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;   # no revelar la versión de PHP
    }

    # Bloquea archivos ocultos: .env, .git, .htaccess...
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
