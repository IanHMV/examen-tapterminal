; Ajustes de PHP para producción.

; No anunciar la versión de PHP (cabecera X-Powered-By).
expose_php = Off

; OPcache: el código no cambia dentro de la imagen,
; así que PHP no necesita revisar los archivos en cada petición.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
