# Nginx de Produccion: sirve Angular y envía /api/ a Laravel (PHP-FPM).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- API: todo lo que empieza con /api/ lo atiende Laravel ----------
    # "^~" hace que esta regla gane sobre las de abajo: así un archivo como
    # /api/docs/asset/swagger-ui.css también va a Laravel.
    # Este Nginx no tiene el código PHP, solo le indica a PHP-FPM qué ejecutar.
    location ^~ /api/ {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    # ---------- Angular: archivos con hash en el nombre (main-AB12CD.js) ----------
    # Si cambia el contenido, cambia el nombre; por eso se pueden guardar un año.
    location ~* \.(?:js|css|woff2?|ico|png|svg|jpg|jpeg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- Angular: cualquier otra ruta (/productos, /usuarios/5...) ----------
    # Devuelve index.html y el router de Angular decide qué pantalla mostrar.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Archivos ocultos (.env, .git...): nunca.
    location ~ /\. {
        deny all;
    }
}
