# Nginx de Produccion: sirve Angular y envía la API a Laravel (PHP-FPM),
# todo bajo la subruta /examen-tapterminal/ (igual que en el VPS).
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Redirecciones con rutas relativas: así funcionan detrás del Nginx del host
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # La raíz y la subruta sin "/" final llevan a la aplicación.
    location = / {
        return 302 /examen-tapterminal/;
    }

    location = /examen-tapterminal {
        return 301 /examen-tapterminal/;
    }

    # ---------- API: /examen-tapterminal/api/----------
    # "^~" hace que esta regla gane sobre las de abajo: así
    # .../api/docs/asset/swagger-ui.css también va a Laravel.
    location ^~ /examen-tapterminal/api/ {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        # Laravel deduce su subruta de SCRIPT_NAME:
        # /examen-tapterminal/api/v1/healthcheck → ruta "api/v1/healthcheck".
        fastcgi_param SCRIPT_NAME /examen-tapterminal/index.php;
        fastcgi_hide_header X-Powered-By;
    }

    # ---------- Angular: archivos con hash en el nombre (main-AB12CD.js) ----------
    # Si cambia el contenido, cambia el nombre; por eso se pueden guardar un año.
    location ~* \.(?:js|css|woff2?|ico|png|svg|jpg|jpeg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- Angular: cualquier otra ruta (/examen-tapterminal/productos/5...) ----------
    # Devuelve index.html y el router de Angular decide qué pantalla mostrar.
    location /examen-tapterminal/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /examen-tapterminal/index.html;
    }

    # Archivos ocultos (.env, .git...): nunca.
    location ~ /\. {
        deny all;
    }
}
